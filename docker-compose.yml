x-django-prod-env: &django_prod_env
  DEBUG: "False"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY?DJANGO_SECRET_KEY is required}
  SECRET_KEY: ${DJANGO_SECRET_KEY?DJANGO_SECRET_KEY is required}

services:
  db:
    image: postgres:16
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    networks:
      - saas_net

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s
    restart: unless-stopped
    networks:
      - saas_net

  web-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      <<: *django_prod_env
    command: ["migrate_collectstatic"]
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    networks:
      - saas_net

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      <<: *django_prod_env
    command: ["web"]
    volumes:
      - ./backend:/app
    ports:
      - "9000:8000"
    depends_on:
      web-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - saas_net

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      <<: *django_prod_env
    command: ["worker"]
    volumes:
      - ./backend:/app
    depends_on:
      web:
        condition: service_healthy
      web-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - saas_net

  ws:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      <<: *django_prod_env
    command: ["websocket"]
    volumes:
      - ./backend:/app
    ports:
      - "9010:8010"
    depends_on:
      web-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - saas_net

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      <<: *django_prod_env
    command: ["beat"]
    volumes:
      - ./backend:/app
    depends_on:
      web:
        condition: service_healthy
      web-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - saas_net

  telegram_poller:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      <<: *django_prod_env
      TELEGRAM_USE_WEBHOOK: ${TELEGRAM_USE_WEBHOOK:-false}
      TELEGRAM_POLLING_LOCK_FILE: ${TELEGRAM_POLLING_LOCK_FILE:-/tmp/tracknode_telegram_polling.lock}
    command: ["telegram_poller"]
    volumes:
      - ./backend:/app
    depends_on:
      web:
        condition: service_healthy
      web-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    networks:
      - saas_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        NUXT_PUBLIC_TRACKNODE_TRACKER_SRC: ${NUXT_PUBLIC_TRACKNODE_TRACKER_SRC:-https://tracknode.ru/tracker.js}
        NUXT_PUBLIC_TRACKNODE_API_KEY: ${NUXT_PUBLIC_TRACKNODE_API_KEY:-}
    env_file:
      - .env
    environment:
      NPM_CONFIG_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
      HOST: 0.0.0.0
      PORT: 9003
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 9003
      NUXT_PUBLIC_API_BASE: ${VITE_API_BASE_URL:-/}
      NUXT_PUBLIC_WS_BASE: ${NUXT_PUBLIC_WS_BASE:-ws://localhost:9010}
    ports:
      - "9003:9003"
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9003/"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - saas_net

networks:
  saas_net:
    driver: bridge

volumes:
  postgres_data:
  frontend_node_modules:
